# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# Local development: `automatically_update_urls_on_dev = true` lets Shopify CLI
# replace application_url / auth / app_proxy URLs with the active tunnel.
# Runtime authPathPrefix is "/auth" (see app/shopify.server.ts).
# App Proxy storefront path: /apps/free-gift/* → backend /apps/proxy/*

client_id = "b335d11311bf491819d273532508a56b"
application_url = "https://example.com"
embedded = true
name = "UpsellTrix"
handle = "upselltrix"

[webhooks]
# Align with Admin runtime (app/shopify.server.ts ApiVersion.July26) and shopify.app.toml.
# Discount Function api_version may differ intentionally (separate Function schema).
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[events]
# Required by Shopify CLI 4.7.0 config validation even when the app has no
# Events API subscriptions (CLI workaround; no deliveries are created).
# Official Events docs remain developer-preview/unstable. Production traffic
# uses [webhooks] above. Do not add dummy [[events.subscription]] topics.
api_version = "unstable"
subscription = []

[access_scopes]
# Runtime Admin GraphQL: discount CRUD + discount metafields, publications
# lookup, and product/variant reads for gift selection. No product writes or
# metaobject usage in current launch functionality.
scopes = "read_discounts,write_discounts,read_publications,read_products"

[auth]
# Must match app/shopify.server.ts authPathPrefix = "/auth".
# Placeholders remain for local CLI URL rewriting; production deploy is gated by
# npm run validate:production-toml (rejects example.com / localhost).
redirect_urls = [ "https://example.com/auth/callback" ]

[app_proxy]
url = "https://example.com/apps/proxy"
subpath = "free-gift"
prefix = "apps"

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
